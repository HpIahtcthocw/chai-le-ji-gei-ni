<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向 C · 装配图纸</title>
<style>
  :root {
    --paper: #f1eee4;
    --ink: #17242f;
    --blue: #23567d;
    --line: #c3bcac;
    --rust: #9c4526;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ded8c9;
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    padding: 40px 20px;
  }
  .sheet {
    width: min(1120px, 100%);
    margin: 0 auto;
    background: var(--paper);
    box-shadow: 0 24px 50px rgba(40, 34, 20, 0.2);
    border: 1px solid #e2dccc;
  }
  .strip {
    display: flex;
    flex-wrap: wrap;
    gap: 26px;
    justify-content: space-between;
    padding: 14px 26px;
    border-bottom: 1px solid var(--line);
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #7b7364;
  }
  .strip b { color: var(--ink); font-weight: 500; }

  .body {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
  }
  .plate {
    position: relative;
    padding: 26px;
    border-right: 1px solid var(--line);
    background-image:
      repeating-linear-gradient(0deg, rgba(35, 86, 125, 0.055) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(35, 86, 125, 0.055) 0 1px, transparent 1px 22px);
  }
  .plate-label {
    position: absolute;
    right: 18px;
    bottom: 14px;
    font-family: "Consolas", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #9a927f;
  }
  svg { width: 100%; height: auto; display: block; }

  .col { padding: 34px 34px 30px; }
  h1 {
    font-size: clamp(34px, 4.6vw, 52px);
    line-height: 1.18;
    letter-spacing: 0.02em;
    font-weight: 800;
  }
  .tagline {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.95;
    color: #5a6570;
    max-width: 360px;
  }
  .quote {
    margin-top: 26px;
    padding: 16px 18px;
    background: #f8f6ee;
    border-left: 3px solid var(--rust);
    font-size: 19px;
    line-height: 1.6;
  }
  .quote span {
    display: block;
    margin-top: 8px;
    font-family: "Consolas", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #9a927f;
  }

  .parts { margin-top: 26px; border-top: 1px solid var(--line); }
  .part-row {
    display: grid;
    grid-template-columns: 46px 1fr 92px;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(195, 188, 172, 0.7);
    font-size: 13px;
  }
  .part-row .no {
    font-family: "Consolas", monospace;
    font-size: 11px;
    color: #8a8271;
    letter-spacing: 0.1em;
  }
  .part-row .nm { color: #3d4852; }
  .part-row .st {
    text-align: right;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #8a8271;
  }
  .part-row.is-next .st { color: var(--rust); }
  .part-row.is-next .nm { color: var(--ink); font-weight: 600; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .primary {
    min-height: 52px;
    padding: 0 30px;
    border: none;
    background: var(--blue);
    color: #f4f1e7;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.22em;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .primary:hover { background: #1a4767; transform: translateY(-1px); }
  .ghost {
    min-height: 52px;
    padding: 0 24px;
    border: 1px solid var(--line);
    background: transparent;
    color: #4d5762;
    font-family: "Consolas", monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    cursor: pointer;
  }
  .ghost:hover { border-color: var(--blue); color: var(--blue); }
  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: space-between;
    padding: 12px 26px;
    border-top: 1px solid var(--line);
    font-family: "Consolas", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #9a927f;
  }

  @media (max-width: 900px) {
    .body { grid-template-columns: 1fr; }
    .plate { border-right: none; border-bottom: 1px solid var(--line); }
    .col { padding: 24px; }
    .part-row { grid-template-columns: 40px 1fr 80px; }
  }
</style>
</head>
<body>
  <main class="sheet">
    <div class="strip">
      <span><b>图号</b> LAMP—07</span>
      <span><b>名称</b> 待考</span>
      <span><b>比例</b> 1 : 4</span>
      <span><b>零件</b> 7 / 7</span>
      <span><b>来源</b> Lux3D 拆分</span>
      <span><b>日期</b> 2026.11</span>
    </div>

    <div class="body">
      <section class="plate">

            <circle cx="262" cy="128" r="27" fill="#f7f4ea" />
            <line x1="262" y1="155" x2="262" y2="168" />

            <path d="M198 172 L326 172 L300 246 L224 246 Z" fill="#f4f0e4" />

            <!-- 灯杆 -->

            <ellipse cx="262" cy="512" rx="96" ry="24" fill="#f4f0e4" />

            <ellipse cx="150" cy="486" rx="40" ry="16" />
            <ellipse cx="150" cy="486" rx="26" ry="10" stroke-dasharray="2 3" />
            <circle cx="150" cy="470" r="8" fill="#f4f0e4" />
          </g>

          <g stroke="#9c4526" stroke-width="0.9" stroke-dasharray="4 4" fill="none">
            <line x1="289" y1="128" x2="432" y2="112" />
            <line x1="326" y1="200" x2="432" y2="176" />
            <line x1="286" y1="266" x2="432" y2="252" />
            <line x1="152" y1="356" x2="432" y2="330" />
            <line x1="272" y1="410" x2="432" y2="410" />
            <line x1="110" y1="486" x2="26" y2="486" />
            <line x1="166" y1="530" x2="26" y2="556" />
          </g>
          <g font-family="Consolas, monospace" font-size="11" fill="#9c4526">
            <circle cx="444" cy="112" r="13" fill="#f7f4ea" stroke="#9c4526" /><text x="444" y="116" text-anchor="middle">01</text>
            <circle cx="444" cy="176" r="13" fill="#f7f4ea" stroke="#9c4526" /><text x="444" y="180" text-anchor="middle">02</text>
            <circle cx="444" cy="252" r="13" fill="#f7f4ea" stroke="#9c4526" /><text x="444" y="256" text-anchor="middle">03</text>
            <circle cx="444" cy="330" r="13" fill="#f7f4ea" stroke="#9c4526" /><text x="444" y="334" text-anchor="middle">04</text>
            <circle cx="444" cy="410" r="13" fill="#f7f4ea" stroke="#9c4526" /><text x="444" y="414" text-anchor="middle">05</text>
            <circle cx="18" cy="486" r="13" fill="#f7f4ea" stroke="#9c4526" /><text x="18" y="490" text-anchor="middle">06</text>
            <circle cx="18" cy="556" r="13" fill="#f7f4ea" stroke="#9c4526" /><text x="18" y="560" text-anchor="middle">07</text>
          </g>
        </svg>
        <div class="plate-label">爆炸视图 · 示意，非精确测量</div>
      </section>

      <section class="col">
        <h1>拆了寄给你</h1>
        <p class="tagline">
          零件按编号一块一块到货，拖到它该在的位置，合上就焊住。
          每合上一块，猜一次这整件东西是什么。
        </p>

        <div class="quote">
          「它每天最后一个关掉自己。」
          <span>寄件人留言 · 没有署名</span>
        </div>

        <div class="parts">
          <div class="part-row is-next"><span class="no">01</span><span class="nm">待拼装件</span><span class="st">已到货</span></div>
          <div class="part-row"><span class="no">02</span><span class="nm">待拼装件</span><span class="st">在途</span></div>
          <div class="part-row"><span class="no">03</span><span class="nm">待拼装件</span><span class="st">在途</span></div>
          <div class="part-row"><span class="no">04</span><span class="nm">待拼装件</span><span class="st">在途</span></div>
          <div class="part-row"><span class="no">05</span><span class="nm">待拼装件</span><span class="st">在途</span></div>
          <div class="part-row"><span class="no">06</span><span class="nm">待拼装件</span><span class="st">在途</span></div>
          <div class="part-row"><span class="no">07</span><span class="nm">待拼装件</span><span class="st">在途</span></div>
        </div>

        <div class="actions">
          <button class="primary" type="button">开 始 装 配</button>
          <button class="ghost" type="button">下载 STL</button>
        </div>
      </section>
    </div>

    <div class="foot">
      <span>3D 资产：Lux3D 图生 3D → 部件拆分</span>
      <span>渲染：aholo-viewer</span>
      <span>LAMP—07 / 1 of 1</span>
    </div>
  </main>
</body>
</html>
