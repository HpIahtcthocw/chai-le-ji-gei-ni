<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向 A · 快递单</title>
<style>
  :root {
    --paper: #e6ddc9;
    --ink: #221d15;
    --ink-soft: #5b5245;
    --stamp: #9c3b25;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    background: #c9bda6;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
  }
  .desk {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 80% at 30% 10%, rgba(255, 250, 240, 0.5), transparent 60%),
      radial-gradient(100% 90% at 80% 90%, rgba(80, 62, 40, 0.35), transparent 65%),
      #c9bda6;
  }
  .sheet {
    position: relative;
    width: min(1080px, 100%);
    padding: 44px 52px 40px;
    background:
      repeating-linear-gradient(0deg, rgba(120, 96, 60, 0.05) 0 1px, transparent 1px 4px),
      radial-gradient(140% 100% at 10% 0%, #f0e8d6, #e2d9c3 70%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.6) inset,
      0 30px 60px rgba(50, 38, 20, 0.28),
      0 2px 6px rgba(50, 38, 20, 0.16);
    transform: rotate(-0.5deg);
  }
  .sheet::before,
  .sheet::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 10px;
    background:
      radial-gradient(circle at 5px 50%, transparent 4px, #c9bda6 4.5px) 0 0/10px 10px;
  }
  .sheet::before { top: -5px; }
  .sheet::after { bottom: -5px; }

  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }
  .head-left { font-size: 13px; letter-spacing: 0.22em; color: var(--ink-soft); }
  .barcode {
    width: 168px;
    height: 34px;
    background: repeating-linear-gradient(
      90deg,
      var(--ink) 0 2px, transparent 2px 4px,
      var(--ink) 4px 5px, transparent 5px 9px,
      var(--ink) 9px 11px, transparent 11px 13px,
      var(--ink) 13px 14px, transparent 14px 19px
    );
    opacity: 0.82;
  }

  .title-wrap { position: relative; margin-top: 30px; }
  .title {
    font-size: clamp(52px, 8.4vw, 96px);
    font-weight: 900;
    letter-spacing: 0.06em;
    line-height: 1;
    transform: rotate(-4deg);
    transform-origin: left center;
    color: var(--stamp);
    opacity: 0.88;
    text-shadow: 0 1px 0 rgba(156, 59, 37, 0.4), 0 0 22px rgba(156, 59, 37, 0.12);
  }
  .title-sub {
    margin-top: 18px;
    font-size: 15px;
    line-height: 1.95;
    color: var(--ink-soft);
    max-width: 560px;
  }

  .fields {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    margin-top: 34px;
    background: rgba(34, 29, 21, 0.22);
    border: 1px solid rgba(34, 29, 21, 0.22);
  }
  .field { background: rgba(255, 252, 244, 0.55); padding: 12px 14px 14px; }
  .field-k { font-size: 11px; letter-spacing: 0.2em; color: #8a7c63; }
  .field-v { margin-top: 6px; font-size: 15px; letter-spacing: 0.04em; }
  .field-v.redacted { color: var(--stamp); letter-spacing: 0.3em; }

  .note-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 26px;
  }
  .note-k { font-size: 11px; letter-spacing: 0.2em; color: #8a7c63; white-space: nowrap; }
  .note-v {
    flex: 1 1 auto;
    padding: 12px 16px;
    font-size: 20px;
    line-height: 1.6;
    border-left: 2px solid var(--ink);
    background: rgba(255, 252, 244, 0.5);
  }

  .tear {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-top: 32px;
    padding-top: 18px;
    border-top: 2px dashed rgba(34, 29, 21, 0.35);
  }
  .tear-hint { font-size: 12px; letter-spacing: 0.16em; color: #8a7c63; }
  .cta {
    position: relative;
    min-width: 240px;
    min-height: 56px;
    padding: 0 34px;
    border: none;
    background: var(--ink);
    color: #f3ecdc;
    font-size: 16px;
    letter-spacing: 0.3em;
    cursor: pointer;
    font-family: inherit;
  }
  .cta::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(243, 236, 220, 0.22);
  }
  .cta:hover { background: var(--stamp); }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 26px;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #93866d;
  }
  @media (max-width: 820px) {
    .sheet { padding: 30px 24px; transform: none; }
    .fields { grid-template-columns: repeat(2, 1fr); }
    .note-v { font-size: 17px; }
    .tear { flex-direction: column; align-items: stretch; gap: 14px; }
    .cta { width: 100%; }
    .barcode { width: 96px; height: 26px; }
  }
</style>
</head>
<body>
  <div class="desk"></div>
  <main class="sheet">
    <div class="head">
      <div>
        <div class="head-left">寄 件 单 · 拆 了 寄 给 你</div>
      </div>
      <div class="barcode" aria-hidden="true"></div>
    </div>

    <div class="title-wrap">
      <h1 class="title">拆了寄给你</h1>
      <p class="title-sub">
        有人把一件东西拆成七块寄了过来。零件一块一块到货，你把它装回去，每装上一块就要猜一次：
        这到底是什么。装完了它会亮起来。
      </p>
    </div>

    <section class="fields">
      <div class="field">
        <div class="field-k">收 件 人</div>
        <div class="field-v">你</div>
      </div>
      <div class="field">
        <div class="field-k">寄 件 人</div>
        <div class="field-v">没有写名字</div>
      </div>
      <div class="field">
        <div class="field-k">内 容 物</div>
        <div class="field-v redacted">■■■■</div>
      </div>
      <div class="field">
        <div class="field-k">件 数 · 重 量</div>
        <div class="field-v">7 件 · 0.48 kg</div>
      </div>
    </section>

    <div class="note-row">
      <div class="note-k">备 注</div>
      <div class="note-v">「它每天最后一个关掉自己。」</div>
    </div>

    <div class="tear">
      <div class="tear-hint">沿虚线撕开，零件会一件一件掉出来</div>
      <button class="cta" type="button">撕 开 这 一 单</button>
    </div>

    <div class="foot">
      <span>3D 资产由 Lux3D 拆分</span>
      <span>渲染 aholo-viewer · 可下载 STL</span>
    </div>
  </main>
</body>
</html>
