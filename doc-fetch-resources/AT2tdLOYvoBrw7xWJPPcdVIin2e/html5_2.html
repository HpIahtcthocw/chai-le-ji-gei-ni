<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="五项可量化改动的预期加分与改动成本对比：开源仓+1分/0.5人日、效果图去红+1分/0.5人日、方位环前置+2分/0.5人日、路演投屏方案+2分/1人日、提级P0+3分/2人日">
<title>动作成本与加分</title>
</head>
<body style="margin:0;background:#FFFFFF;">
<div style="width:100%;max-width:820px;box-sizing:border-box;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
<svg viewBox="0 0 820 320" width="100%" style="display:block;" role="img" aria-label="五项改动的预期加分与改动成本对比横向条形图">
  <text x="18" y="26" font-size="16" font-weight="600" fill="#1F2329">加分与成本：半天到两天内的五项改动合计 9 分</text>
  <text x="18" y="48" font-size="11" fill="#646A73">横向长度 = 预期加分（分）；条末标注改动成本（人日）</text>

  <line x1="230" y1="72" x2="230" y2="262" stroke="#DDE3E8" stroke-width="1"/>
  <line x1="381.4" y1="72" x2="381.4" y2="262" stroke="#DDE3E8" stroke-width="1"/>
  <line x1="532.9" y1="72" x2="532.9" y2="262" stroke="#DDE3E8" stroke-width="1"/>
  <line x1="684.3" y1="72" x2="684.3" y2="262" stroke="#DDE3E8" stroke-width="1"/>

  <text x="230" y="282" font-size="11" fill="#646A73" text-anchor="middle">0 分</text>
  <text x="381.4" y="282" font-size="11" fill="#646A73" text-anchor="middle">1 分</text>
  <text x="532.9" y="282" font-size="11" fill="#646A73" text-anchor="middle">2 分</text>
  <text x="684.3" y="282" font-size="11" fill="#646A73" text-anchor="middle">3 分</text>

  <text x="18" y="99" font-size="14" font-weight="600" fill="#1F2329">开源提交仓</text>
  <rect x="230" y="86" width="530" height="16" rx="2" fill="#F2F4F6"/>
  <rect x="230" y="86" width="151.4" height="16" rx="2" fill="#1A2B4A"/>
  <text x="391.4" y="99.5" font-size="12" fill="#646A73">0.5 人日</text>

  <text x="18" y="139" font-size="14" font-weight="600" fill="#1F2329">效果图去红重出</text>
  <rect x="230" y="126" width="530" height="16" rx="2" fill="#F2F4F6"/>
  <rect x="230" y="126" width="151.4" height="16" rx="2" fill="#1A2B4A"/>
  <text x="391.4" y="139.5" font-size="12" fill="#646A73">0.5 人日</text>

  <text x="18" y="179" font-size="14" font-weight="600" fill="#1F2329">方位环前置</text>
  <rect x="230" y="166" width="530" height="16" rx="2" fill="#F2F4F6"/>
  <rect x="230" y="166" width="302.9" height="16" rx="2" fill="#1A2B4A"/>
  <text x="542.9" y="179.5" font-size="12" fill="#646A73">0.5 人日</text>

  <text x="18" y="219" font-size="14" font-weight="600" fill="#1F2329">路演投屏方案</text>
  <rect x="230" y="206" width="530" height="16" rx="2" fill="#F2F4F6"/>
  <rect x="230" y="206" width="302.9" height="16" rx="2" fill="#1A2B4A"/>
  <text x="542.9" y="219.5" font-size="12" fill="#646A73">1 人日</text>

  <text x="18" y="259" font-size="14" font-weight="600" fill="#1F2329">提级 P0</text>
  <rect x="230" y="246" width="530" height="16" rx="2" fill="#F2F4F6"/>
  <rect x="230" y="246" width="454.3" height="16" rx="2" fill="#1A2B4A"/>
  <text x="694.3" y="259.5" font-size="12" fill="#646A73">2 人日</text>
</svg>
<p style="margin:10px 0 0;font-size:12px;line-height:1.7;color:#646A73;">口径：加分为按官方六维的自评分增量估计，同一维内可累加；两项门槛型动作不进本图——按六维写提交说明文档（决定能否进决赛）、砍 P1 清单（保住完成度分），它们不产生加分，而是避免失分。</p>
</div>
</body>
</html>
